<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Ice Store</title>
    <!-- Favicon (Ícone na aba do navegador) -->
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ajuste rápido para alinhar o logo com o nome se quiseres adicionar o texto ao lado */
        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        .logo-top {
            width: 80px; /* Ajusta o tamanho conforme preferires */
            height: auto;
            border-radius: 50%; /* Deixa o logo redondo se for quadrado */
        }
    </style>
</head>
<body>

    <!-- ÍCONE DO MENU (3 traços) -->
    <div id="menu-icon" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>
   
    <!-- BOTÃO RETROCEDER -->
    <button id="btn-retroceder" class="retroceder-fixo" onclick="mostrarHome()">✖ Sair</button>

    <!-- SECÇÃO PRINCIPAL (Hero) -->
    <header class="hero">
        <div class="hero-content">
            <div class="brand-container">
                <img src="logo.jpeg" alt="Two Ice Store" class="logo-top">
                <h1 style="margin: 0;">Two Ice Store</h1>
            </div>
            <h2 style="font-size: 1.2rem; font-weight: normal; opacity: 0.9;">Qualidade Premium ao Melhor Preço</h2>
            <p>As tuas camisolas favoritas de épocas clássicas e atuais.</p>
            <a href="#catalogo-section" class="btn-main">VER CATÁLOGO COMPLETO</a>
        </div>

        <div class="motivos-hero">
            <div class="motivo-card-hero">
                <span>⭐</span>
                <h3>Qualidade Tailandesa</h3>
                <p>Tecidos e bordados idênticos.</p>
            </div>
            <div class="motivo-card-hero">
                <span>🚀</span>
                <h3>Envio Rápido</h3>
                <p>Recebe com segurança.</p>
            </div>
            <div class="motivo-card-hero">
                <span>🛡️</span>
                <h3>Confiança</h3>
                <p>Feedback de centenas de clientes.</p>
            </div>
        </div>
    </header>

    <!-- SECÇÃO DO CATÁLOGO -->
    <section id="catalogo-section">
        <div id="breadcrumb"></div>
        <div id="lista"></div>
    </section>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
