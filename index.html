<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Ice Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">

        <h1>CAMISOLAS DE FUTEBOL PREMIUM</h1>
        <p>Seleções e clubes de elite — estilo, história e paixão</p>

        <a href="#catalogo" class="btn-main">
            VER CATÁLOGO
        </a>

    </div>
</section>

<!-- CATÁLOGO -->
<section id="catalogo" class="catalogo">

    <h2>Seleções & Clubes</h2>

    <div class="grid">

        <div class="card">
            <img src="images/portugal.jpg">
            <h3>Portugal</h3>
        </div>

        <div class="card">
            <img src="images/brasil.jpg">
            <h3>Brasil</h3>
        </div>

        <div class="card">
            <img src="images/real.jpg">
            <h3>Real Madrid</h3>
        </div>

        <div class="card">
            <img src="images/benfica.jpg">
            <h3>Benfica</h3>
        </div>

    </div>

</section>

</body>
</html>
