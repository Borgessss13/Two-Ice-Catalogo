<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Ice Store</title>
    
    <!-- ISTO É O QUE ADICIONA O LOGO NA ABA DO SEPARADOR -->
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    <!-- Para garantir compatibilidade com iPhones/Android -->
    <link rel="apple-touch-icon" href="logo.jpeg">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ÍCONE DO MENU (3 traços) -->
    <div id="menu-icon" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- BOTÃO RETROCEDER -->
    <button id="btn-retroceder" class="retroceder-fixo" onclick="mostrarHome()">✖ Sair</button>

    <!-- SECÇÃO PRINCIPAL (Hero) -->
 <header class="hero">
    <div class="hero-overlay"></div>

    <div class="hero-content">
        <img src="logo.jpeg" alt="Two Ice Store" class="logo-top">

        <h1>Two Ice Store</h1>

        <p>Camisas de futebol premium • Qualidade elite • Estilo autêntico</p>

        <a href="#catalogo-section" class="btn-main">
            VER CATÁLOGO
        </a>
    </div>



    <!-- SECÇÃO DO CATÁLOGO -->
    <section id="catalogo-section">
        <div id="breadcrumb"></div>
        <div id="lista"></div>
    </section>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
