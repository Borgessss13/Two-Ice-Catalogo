<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Ice Store </title>
    <!-- Google Fonts para um aspeto mais profissional -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BOTÃO RETROCEDER (Aparece via JS quando entras numa liga) -->
    <button id="btn-retroceder" class="retroceder-fixo" onclick="mostrarHome()">✖ Sair</button>

    <!-- SECÇÃO PRINCIPAL (OCUPA A TELA TODA) -->
    <header class="hero">
        
        <!-- Conteúdo Central: Logo e Chamada -->
        <div class="hero-content">
            <img src="logo.jpegs" alt="Two Ice Store" class="logo-top">
            <h1>Qualidade Premium ao Melhor Preço</h1>
            <p>As tuas camisolas favoritas de épocas clássicas e atuais.</p>
            
            <!-- Botão Transparente com Bordas -->
            <a href="#catalogo-section" class="btn-main">VER CATÁLOGO COMPLETO</a>
        </div>

        <!-- As 3 Caixinhas de Motivos (No fundo da imagem) -->
        <div class="motivos-hero">
            <div class="motivo-card-hero">
                <span>⭐</span>
                <h3>Qualidade Tailandesa</h3>
                <p>Tecidos e bordados idênticos.</p>
            </div>
            <div class="motivo-card-hero">
                <span>🚀</span>
                <h3>Envio Rápido</h3>
                <p>Recebe com segurança.</p>
            </div>
            <div class="motivo-card-hero">
                <span>🛡️</span>
                <h3>Confiança</h3>
                <p>Feedback de centenas de clientes.</p>
            </div>
        </div>

    </header>
 <!-- CONTENTOR DE TOPO (LOGO + PESQUISA) -->
<div class="header-search-wrapper">
    <img src="logo.jpeg" alt="Two Ice Logo" class="search-logo">
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Pesquisar camisolas..." onkeyup="filtrarCamisolas()">
        <span class="search-icon">🔍</span>
    </div>
</div>

    <!-- SECÇÃO DO CATÁLOGO -->
    <section id="catalogo-section">
        <!-- O Breadcrumb será gerado pelo JavaScript (Ex: Portugal > Principal) -->
        <div id="breadcrumb"></div>
        
        <!-- Onde as camisolas e ligas vão aparecer dinamicamente -->
        <div id="lista"></div>
    </section>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
