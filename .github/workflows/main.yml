name: Atualizar Site Automaticamente
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Python e Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          
      - name: Correr Robô (Baixar Fotos)
        run: python atualizar_catalogo.py
        
      - name: Guardar Alterações no GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'
          git add dados.json camisolas/
          git commit -m "Catálogo e Fotos Atualizados" || echo "Sem alterações"
          git push
