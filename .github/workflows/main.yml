name: Atualizar Site Automaticamente
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Instalar Python
        run: pip install requests beautifulsoup4
      - name: Correr Robô
        run: python atualizar_catalogo.py
           - name: Guardar Alterações
        run: |
          git config --global user.name 'Robo-Catalogo'
          git config --global user.email 'bot@github.com'
          git add dados.json camisolas/*
          git commit -m "Fotos e dados atualizados" || echo "Sem alterações"
          git push
